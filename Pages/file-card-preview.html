<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SheetSubmit file card preview</title>
  <link rel="stylesheet" href="./src/app.css">
  <style>
    body {
      min-height: 100%;
      overflow: auto;
      padding: 32px 24px;
    }
    main {
      width: min(100%, 720px);
      margin: 0 auto;
    }
    .preview-label {
      color: var(--text3);
      font-size: 12px;
      margin-bottom: 12px;
    }
    .files-grid {
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    }
    .file-type-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <main>
    <div class="preview-label">File card preview</div>
    <section class="files-grid" aria-label="File cards">
      <article class="file-card" tabindex="0">
        <div class="file-card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
            <path d="M16 3h5v5" />
            <path d="m21 3-9 9" />
          </svg>
        </div>
        <div class="file-card-name">DGD cookie files</div>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px">
          <span class="file-type-badge" title="Facebook" aria-label="Facebook">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M14 8h3V4h-3c-3.314 0-5 1.686-5 5v3H6v4h3v8h4v-8h3l1-4h-4V9c0-.667.333-1 1-1Z" /></svg>
          </span>
          <span class="file-type-badge" style="background:var(--bg3);color:var(--text2)" title="dgddigital">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12a1 1 0 0 1-10 0 1 1 0 0 0-10 0"/><path d="M7 20.7a1 1 0 1 1 5-8.7 1 1 0 1 0 5-8.6"/><path d="M7 3.3a1 1 0 1 1 5 8.6 1 1 0 1 0 5 8.6"/><circle cx="12" cy="12" r="10"/></svg>
          </span>
          <span class="file-card-meta">124 rows</span>
        </div>
        <div class="file-card-actions">
          <button class="file-card-btn" title="Download" aria-label="Download"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button>
          <button class="file-card-btn" title="Rename" aria-label="Rename"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
          <button class="file-card-btn file-card-del" title="Delete" aria-label="Delete"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 15H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>
        </div>
      </article>

      <article class="file-card" tabindex="0">
        <div class="file-card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
            <path d="M16 3h5v5" />
            <path d="m21 3-9 9" />
          </svg>
        </div>
        <div class="file-card-name">LOVE page files</div>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px">
          <span class="file-type-badge" title="Facebook" aria-label="Facebook">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M14 8h3V4h-3c-3.314 0-5 1.686-5 5v3H6v4h3v8h4v-8h3l1-4h-4V9c0-.667.333-1 1-1Z" /></svg>
          </span>
          <span class="file-type-badge" style="background:var(--bg3);color:var(--text2)" title="L0VE@12345">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg>
          </span>
          <span class="file-card-meta">87 rows</span>
        </div>
        <div class="file-card-actions">
          <button class="file-card-btn" title="Download" aria-label="Download"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></button>
          <button class="file-card-btn" title="Rename" aria-label="Rename"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
          <button class="file-card-btn file-card-del" title="Delete" aria-label="Delete"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 15H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
