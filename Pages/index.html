<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>SheetSubmit</title>
    <script>
      // Apply stored theme before first paint to avoid a flash of the wrong theme.
      // Default is light; only a saved "dark" choice flips it.
      (function () {
        try {
          var t = localStorage.getItem("ss_theme");
          if (t !== "dark" && t !== "light") t = "light";
          var dark = t === "dark";
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = t;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = dark ? "#000000" : "#ffffff";
          var fav = document.querySelector('link[rel="icon"]');
          if (fav) fav.href = dark ? "/favicon-dark.svg" : "/favicon-light.svg";
        } catch (e) {}
      })();
    </script>
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
