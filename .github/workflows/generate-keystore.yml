name: Generate Android Keystore

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-keystore.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          mkdir -p "$RUNNER_TEMP/ks"
          KEYSTORE_PASS="SheetSubmit_$(date +%s)"
          echo -n "$KEYSTORE_PASS" > "$RUNNER_TEMP/ks/keystore_password.txt"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/ks/sheetsubmit-release.keystore" \
            -alias sheetsubmit \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEYSTORE_PASS" \
            -dname "CN=SheetSubmit, OU=Dev, O=SheetSubmit, L=NA, S=NA, C=NA"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheetsubmit-release-keystore
          path: |
            ${{ runner.temp }}/ks/sheetsubmit-release.keystore
            ${{ runner.temp }}/ks/keystore_password.txt
          if-no-files-found: error