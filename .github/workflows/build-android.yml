name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Every release has been debug-signed with a fresh per-run random key, so users can NEVER install an update over a previous release (signature mismatch -> 'App not installed'). Fix: run the 'Generate Android Keystore' workflow, download the 'sheetsubmit-release-keystore' artifact, set ANDROID_KEYSTORE_BASE64 (base64 of the keystore file) and ANDROID_KEYSTORE_PASSWORD in repo secrets, then re-run."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/android-release.keystore
          echo "KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "Release keystore decoded"

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          VERSION_CODE: ${{ github.run_number }}

      - name: Rename APK with version name
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/SheetSubmit-1.0.${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/SheetSubmit.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: sheetsubmit-apk
          path: android/app/build/outputs/apk/release/SheetSubmit-1.0.${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            LOG=$(git log --oneline --no-merges "$PREV..HEAD")
          else
            LOG=$(git log --oneline --no-merges -20)
          fi
          {
            echo "SheetSubmit build v${{ github.run_number }}"
            echo ""
            echo "What's new in this version:"
            echo ""
            echo "$LOG" | sed 's/^/- /'
          } > changelog.md
          echo "Changelog:"
          cat changelog.md

      - name: Publish GitHub Release (v${{ github.run_number }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: v${{ github.run_number }}
          body_path: changelog.md
          files: |
            android/app/build/outputs/apk/release/SheetSubmit-1.0.${{ github.run_number }}.apk
            android/app/build/outputs/apk/release/SheetSubmit.apk
