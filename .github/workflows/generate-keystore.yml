name: Generate Android Keystore

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: "Keystore password (also set as ANDROID_KEYSTORE_PASSWORD repo secret)"
        required: true
        type: string
  push:
    paths:
      - '.github/workflows/generate-keystore.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        env:
          KEYSTORE_PASS: ${{ inputs.keystore_password }}
        run: |
          if [ -z "$KEYSTORE_PASS" ]; then echo "::error::Provide keystore_password input (same value as ANDROID_KEYSTORE_PASSWORD secret)"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/ks"
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/ks/sheetsubmit-release.keystore" \
            -alias sheetsubmit \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEYSTORE_PASS" \
            -dname "CN=SheetSubmit, OU=Dev, O=SheetSubmit, L=NA, S=NA, C=NA"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheetsubmit-release-keystore
          path: |
            ${{ runner.temp }}/ks/sheetsubmit-release.keystore
          if-no-files-found: error